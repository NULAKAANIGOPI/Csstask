<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #111;
  color: #fff;
  font-family: system-ui, sans-serif;
}

.scene {
  width: 200px;
  height: 200px;
  perspective: 600px; 
}


.cube {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d; 
  transform: rotateX(-20deg) rotateY(30deg); 
  animation: spin 8s infinite linear;
}
.face {
  position: absolute;
  width: 200px;
  height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid black;
  box-sizing: border-box;


  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
}

.front  { 
    transform: translateZ(100px);
    background: url(https://plus.unsplash.com/premium_photo-1661878265739-da90bc1af051?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OXx8dGVjaG5vbG9neXxlbnwwfHwwfHx8MA%3D%3D);
}
.back   { 
    transform: rotateY(180deg) translateZ(100px);
    background: url(https://plus.unsplash.com/premium_photo-1683121716061-3faddf4dc504?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTN8fHRlY2hub2xvZ3l8ZW58MHx8MHx8fDA%3D);
}
.right  { 
    transform: rotateY(90deg) translateZ(100px); 
    background: url(https://plus.unsplash.com/premium_photo-1683121710572-7723bd2e235d?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MzN8fHRlY2hub2xvZ3l8ZW58MHx8MHx8fDA%3D);
}
.left   {
     transform: rotateY(-90deg) translateZ(100px); 
     background: url(https://images.unsplash.com/photo-1496065187959-7f07b8353c55?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NDR8fHRlY2hub2xvZ3l8ZW58MHx8MHx8fDA%3D);
}
.top    {
     transform: rotateX(90deg) translateZ(100px);
     background: url(https://images.unsplash.com/photo-1567095761054-7a02e69e5c43?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTY4fHx0ZWNobm9sb2d5fGVufDB8fDB8fHww);
}
.bottom {
     transform: rotateX(-90deg) translateZ(100px);
     background: url(https://images.unsplash.com/photo-1667264501379-c1537934c7ab?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MzI5fHx0ZWNobm9sb2d5fGVufDB8fDB8fHww);
}

@keyframes spin {
  from {
     transform: rotateX(0deg) rotateY(0deg) rotateZ(20deg); 
}
  to   {
     transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); 
}
}
</style>




</head>
<body>
     <div class="scene">
         <div class="cube">
            <div class="face front">front</div>
            <div class="face back">back</div>
            <div class="face right">right</div>
            <div class="face left">left</div>
            <div class="face top">top</div>
            <div class="face bottom">bottom</div>
         </div>
</div>
</body>
</html>
