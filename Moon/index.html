<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: black;
        }
        h1{
          /* text-align: center; */
          color:red;
          font-family: cursive;
          font-weight: bold;
          font-size: 50px;
          margin:20px 500px;
        }
        .container{
            padding: 30px;
        }
        .moon{
            background-color: black;
            height:150px;
            width:150px;
            margin:40px 40px 40px 40px;
            border-radius: 50%;
            text-align: center;
            line-height: 150px;
            color:red;
            display: inline-block;
        }
        #one{
             border: 1px solid beige;
             box-shadow:0px 0px 0px 0px beige inset;
        }
        #two{
            box-shadow: -7px -7px 0px 5px beige inset ;
        }
        #three{
             box-shadow: -14px -14px 0 5px beige inset;
        }
        #four{
             box-shadow: -21px -21px 0 5px beige inset;
        }
        #five{
             box-shadow: -28px -28px 0 5px beige inset;
        }
        #six{
             box-shadow: -35px -35px 0 5px beige inset;
        }
        #seven{
             box-shadow: -42px -42px 0 5px beige inset;
        }
        #eight{
             box-shadow: -49px -49px 0 5px beige inset;
        }
        #nine{
             box-shadow: -56px -56px 0 5px beige inset;
        }
        #ten{
             box-shadow: -64px -63px 0 5px beige inset;
        }
        #eleven{
             box-shadow: -70px -70px 0 5px beige inset;
        }
        #twelve{
             box-shadow: -77px -77px 0 5px beige inset;
        }
        #thirteen{
             box-shadow: -84px -84px 0 5px beige inset;
        }
        #fourteen{
             box-shadow: -91px -91px 0 5px beige inset;
        }
        #fifteen{
             box-shadow: -105px -105px 0 5px beige inset;
        }
    </style>
</head>
<body>
    <h1>Phases of moon</h1>
    <div class="container">
        <div class="moon" id="one">1<sup>st</sup>day</div>
        <div class="moon" id="two">2<sup>nd</sup>day</div>
        <div class="moon" id="three">3<sup>rd</sup>day</div>
        <div class="moon" id="four">4<sup>th</sup>day</div>
        <div class="moon" id="five">5<sup>th</sup>day</div>
        <div class="moon" id="six">6<sup>th</sup>day</div>
        <div class="moon" id="seven">7<sup>th</sup>day</div>
        <div class="moon" id="eight">8<sup>th</sup>day</div>
        <div class="moon" id="nine">9<sup>th</sup>day</div>
        <div class="moon" id="ten">10<sup>th</sup>day</div>
        <div class="moon" id="eleven">11<sup>th</sup>day</div>
        <div class="moon" id="twelve">12<sup>th</sup>day</div>
        <div class="moon" id="thirteen">13<sup>th</sup>day</div>
        <div class="moon" id="fourteen">14<sup>th</sup>day</div>
        <div class="moon" id="fifteen">15<sup>th</sup>day</div>
    </div>
</body>
</html>
